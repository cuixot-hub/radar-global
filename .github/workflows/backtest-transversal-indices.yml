name: Backtest transversal indices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backtest-transversal-indices.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular backtest transversal sin optimizacion
        shell: python
        run: |
          import json, urllib.request, urllib.parse, datetime, csv, io, statistics, os
          UA={'User-Agent':'Mozilla/5.0 radar-global transversal-backtest'}
          START='2004-01'
          END='2026-07'
          def get_text(url):
            req=urllib.request.Request(url,headers=UA)
            return urllib.request.urlopen(req,timeout=60).read().decode()
          def get_json(url): return json.loads(get_text(url))
          def yahoo_monthly(symbol):
            q=urllib.parse.quote(symbol,safe='')
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{q}?period1=0&period2=1798761600&interval=1mo&includeAdjustedClose=false&events=div%2Csplits'
            j=get_json(url)['chart']['result'][0]
            out=[]
            for t,v in zip(j['timestamp'],j['indicators']['quote'][0]['close']):
              if v is None: continue
              m=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).strftime('%Y-%m')
              out.append({'month':m,'price':float(v)})
            d={r['month']:r['price'] for r in out}
            return [{'month':m,'price':d[m]} for m in sorted(d)]
          def github_csv(url,col):
            rows=list(csv.DictReader(io.StringIO(get_text(url))))
            out=[]
            for r in rows:
              mm,yy=r['Date'].split('/')
              m=f'{yy}-{mm}'
              out.append({'month':m,'price':float(r[col])})
            d={r['month']:r['price'] for r in out}
            return [{'month':m,'price':d[m]} for m in sorted(d)]
          def common_filter(rows): return [r for r in rows if START <= r['month'] <= END]
          def classify(rows):
            vals=[r['price'] for r in rows]
            out=[]
            for i,r in enumerate(rows):
              if i<12: continue
              ma10=sum(vals[i-9:i+1])/10
              pct=(r['price']/ma10-1)*100
              color='green' if pct>5 else 'yellow' if pct>=0 else 'red' if pct>=-5 else 'purple'
              tr12=vals[i-1]/vals[i-13]-1 if i>=13 else None
              out.append({**r,'ma10':ma10,'pct':pct,'color':color,'trailing12_prev':tr12})
            return out
          def episodes(rows):
            eps=[]; active=False; cur=None
            for i,r in enumerate(rows):
              c=r['color']
              prev=rows[i-1]['color'] if i>0 else None
              bull=(r.get('trailing12_prev') is not None and r['trailing12_prev']>0)
              valid_start=(c in ('red','purple') and prev in ('green','yellow') and bull)
              if not active and valid_start:
                active=True; cur={'start':r['month'],'rows':[]}
              if active:
                if c in ('red','purple'):
                  cur['rows'].append(r)
                else:
                  cur['end']=cur['rows'][-1]['month']
                  eps.append(cur); cur=None; active=False
            if active and cur and cur['rows']:
              cur['end']=cur['rows'][-1]['month']; eps.append(cur)
            return eps
          def backtest(rows):
            eps=episodes(rows); active_months={x['month'] for e in eps for x in e['rows']}
            units=0.0; invested=0.0
            signal_rows=[]
            for r in rows:
              buy=100.0
              if r['month'] in active_months:
                buy=125.0 if r['color']=='red' else 300.0
                signal_rows.append(r)
              units += buy/r['price']; invested += buy
            last=rows[-1]['price']; final=units*last
            avg=invested/len(rows); equal_units=sum(avg/r['price'] for r in rows); equal_final=equal_units*last
            red=sum(r['color']=='red' for r in signal_rows); purple=sum(r['color']=='purple' for r in signal_rows)
            durations=[len(e['rows']) for e in eps]
            # reserva = extras sobre DCA base dentro del episodio
            for e in eps:
              e['red']=sum(x['color']=='red' for x in e['rows'])
              e['purple']=sum(x['color']=='purple' for x in e['rows'])
              e['duration']=len(e['rows'])
              e['reserve']=e['red']*25 + e['purple']*200
            worst=max(eps,key=lambda e:e['reserve']) if eps else None
            return {
              'months':len(rows),'start':rows[0]['month'],'end':rows[-1]['month'],
              'episodes':len(eps),'signal_months':len(signal_rows),'red':red,'purple':purple,
              'median_duration':statistics.median(durations) if durations else 0,
              'mean_duration':statistics.mean(durations) if durations else 0,
              'max_duration':max(durations) if durations else 0,
              'invested_dynamic':invested,'final_dynamic':final,
              'equal_capital_monthly':avg,'final_equal_constant':equal_final,
              'timing_advantage_same_capital':final/equal_final-1 if equal_final else None,
              'worst_episode': None if not worst else {'start':worst['start'],'end':worst['end'],'duration':worst['duration'],'red':worst['red'],'purple':worst['purple'],'reserve_per_100_base':worst['reserve']},
              'episodes_detail':[{'start':e['start'],'end':e['end'],'duration':e['duration'],'red':e['red'],'purple':e['purple'],'reserve_per_100_base':e['reserve']} for e in eps]
            }
          world=github_csv('https://raw.githubusercontent.com/PulfordJ/synthetic-global-equity/master/data/msci_world_index_dec_1969_to_may_2026.csv','MSCI World')
          acwi=github_csv('https://raw.githubusercontent.com/PulfordJ/synthetic-global-equity/master/data/msci_acwi_index_dec_1987_to_may_2026.csv','MSCI ACWI')
          series={
            'SP500': yahoo_monthly('^GSPC'),
            'MSCI_WORLD': world,
            'ACWI': acwi,
            'NASDAQ100': yahoo_monthly('^NDX'),
            'EMERGING_MARKETS': yahoo_monthly('EEM'),
            'SMALL_CAPS': yahoo_monthly('^RUT'),
          }
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'method':'Sin optimizacion: MA10 mensual; >+5 verde, 0..+5 amarillo, -5..0 rojo, <-5 morado; episodio inicia desde verde/amarillo con trailing 12m previo positivo; compras 100/125/300; comparación mismo capital','common_window':{'start':START,'end':END},'results':{}}
          for k,s in series.items():
            f=common_filter(s)
            c=classify(f)
            out['results'][k]=backtest(c)
          os.makedirs('backtests',exist_ok=True)
          with open('backtests/transversal_indices.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          summary={'generated_at':out['generated_at'],'method':out['method'],'common_window':out['common_window'],'results':{k:{q:v[q] for q in ['months','start','end','episodes','signal_months','red','purple','median_duration','mean_duration','max_duration','invested_dynamic','final_dynamic','equal_capital_monthly','final_equal_constant','timing_advantage_same_capital','worst_episode']} for k,v in out['results'].items()}}
          with open('backtests/transversal_indices_summary.json','w',encoding='utf-8') as f: json.dump(summary,f,ensure_ascii=False,indent=2)
      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/transversal_indices.json backtests/transversal_indices_summary.json
          git diff --cached --quiet || git commit -m 'Calcular backtest transversal indices'
          git push