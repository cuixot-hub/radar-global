name: Actualizar datos del Radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar series FRED
        shell: python
        run: |
          import json, urllib.request, csv, io, time
          ids=['M2SL','FEDFUNDS','WALCL','T10Y2Y','BAA10Y','VIXCLS','GOLDAMGBD228NLBM','DEXUSEU','SP500']
          out={x:[] for x in ids}
          for x in ids:
            url='https://fred.stlouisfed.org/graph/fredgraph.csv?id='+x
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            raw=urllib.request.urlopen(req,timeout=60).read().decode('utf-8-sig')
            rows=csv.DictReader(io.StringIO(raw))
            for r in rows:
              date=r.get('observation_date') or r.get('DATE') or r.get('date')
              try:
                v=float(r[x])
                if date and v==v: out[x].append({'date':date,'v':v})
              except: pass
            time.sleep(0.5)
          with open('data.json','w',encoding='utf-8') as f: json.dump(out,f,separators=(',',':'))
      - name: Publicar datos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m 'Actualizar datos del Radar'
          git push
