name: Backtest reserva por drawdown oro y Bitcoin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backtest-drawdown-reserve.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular estrategias de reserva
        shell: python
        run: |
          import json, urllib.request, urllib.parse, datetime, math, os
          UA={'User-Agent':'Mozilla/5.0 radar-global drawdown-backtest'}
          def get_json(url):
            req=urllib.request.Request(url,headers=UA)
            return json.loads(urllib.request.urlopen(req,timeout=60).read().decode())
          def monthly(symbol,years='max'):
            q=urllib.parse.quote(symbol,safe='')
            j=get_json(f'https://query1.finance.yahoo.com/v8/finance/chart/{q}?range={years}&interval=1mo&includeAdjustedClose=true&events=div%2Csplits')['chart']['result'][0]
            ts=j['timestamp']; close=j['indicators']['quote'][0]['close']; adj=(j['indicators'].get('adjclose') or [{}])[0].get('adjclose') or close
            out=[]
            seen=set()
            for t,a,c in zip(ts,adj,close):
              v=a if a is not None else c
              if v is None: continue
              m=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).strftime('%Y-%m')
              if m in seen: continue
              seen.add(m); out.append({'month':m,'price':float(v)})
            return out
          def irr(cfs):
            lo,hi=-.999,10.0
            def npv(r): return sum(cf/((1+r)**i) for i,cf in enumerate(cfs))
            for _ in range(180):
              mid=(lo+hi)/2
              if npv(mid)>0: lo=mid
              else: hi=mid
            return (1+(lo+hi)/2)**12-1
          def simulate(rows,levels,pcts,base=25.0):
            units=0.0; invested=0.0; extra_total=0.0; cfs=[]; peak_price=0.0; fired=set(); events=[]; episode_extra=0.0; max_episode_extra=0.0
            vals=[]
            for r in rows:
              p=r['price']
              if p>peak_price:
                if peak_price>0:
                  max_episode_extra=max(max_episode_extra,episode_extra)
                peak_price=p; fired=set(); episode_extra=0.0
              dd=p/peak_price-1 if peak_price else 0.0
              # base DCA first
              units += base/p; invested += base; cf=-base
              port_before_extra=units*p
              # trigger all newly crossed levels in this month, once per ATH episode
              for lev,pct in zip(levels,pcts):
                if dd <= -lev and lev not in fired:
                  extra=port_before_extra*pct
                  units += extra/p; invested += extra; extra_total += extra; cf -= extra; episode_extra += extra
                  events.append({'month':r['month'],'drawdown':dd,'level':lev,'pct':pct,'extra':extra,'portfolio_before_extra':port_before_extra})
                  fired.add(lev)
                  port_before_extra=units*p
              vals.append(units*p); cfs.append(cf)
            max_episode_extra=max(max_episode_extra,episode_extra)
            final=units*rows[-1]['price']; cfs[-1]+=final
            peak=vals[0]; mdd=0.0
            for v in vals:
              peak=max(peak,v); mdd=min(mdd,v/peak-1)
            avg=invested/len(rows); eq_units=sum(avg/r['price'] for r in rows); eq_final=eq_units*rows[-1]['price']
            return {'invested':invested,'extra_total':extra_total,'final_value':final,'gain':final-invested,'annualized_money_weighted':irr(cfs),'max_drawdown_portfolio':mdd,'equal_capital_constant_final':eq_final,'timing_advantage_same_capital':final/eq_final-1,'events':len(events),'max_episode_extra':max_episode_extra,'event_detail':events}
          def baseline(rows,base=25.0):
            units=sum(base/r['price'] for r in rows); invested=base*len(rows); final=units*rows[-1]['price']
            cfs=[-base]*len(rows); cfs[-1]+=final
            return {'invested':invested,'final_value':final,'annualized_money_weighted':irr(cfs)}
          schemes={
            'conservadora':[0.025,0.05,0.075,0.10,0.125],
            'equilibrada':[0.05,0.075,0.10,0.125,0.15],
            'fuerte':[0.05,0.10,0.15,0.20,0.25]
          }
          configs={
            'GLD':{'symbol':'GLD','levels':[0.10,0.20,0.30,0.40,0.50]},
            'BTC':{'symbol':'BTC-USD','levels':[0.20,0.35,0.50,0.65,0.75]}
          }
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'method':'DCA base 25 mensual + compras extraordinarias una sola vez por escalon de drawdown desde maximo. Los escalones se rearman solo al marcar nuevo maximo. Extra = porcentaje del valor de la posicion justo antes de la compra extraordinaria.'}
          for key,cfg in configs.items():
            rows=monthly(cfg['symbol'])
            # igualamos ventanas con backtest previo por robustez: BTC desde 2016-09, GLD desde 2006-11
            start='2016-09' if key=='BTC' else '2006-11'
            rows=[r for r in rows if r['month']>=start]
            d={'start':rows[0]['month'],'end':rows[-1]['month'],'months':len(rows),'levels':cfg['levels'],'baseline25':baseline(rows),'schemes':{}}
            for name,pcts in schemes.items(): d['schemes'][name]={'pcts':pcts,**simulate(rows,cfg['levels'],pcts)}
            out[key]=d
          os.makedirs('backtests',exist_ok=True)
          with open('backtests/drawdown_reserve_gold_btc.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          compact={'generated_at':out['generated_at'],'method':out['method']}
          for key in ['GLD','BTC']:
            x=out[key]; compact[key]={'start':x['start'],'end':x['end'],'months':x['months'],'levels':x['levels'],'baseline25':x['baseline25'],'schemes':{}}
            for n,s in x['schemes'].items(): compact[key]['schemes'][n]={k:s[k] for k in ['pcts','invested','extra_total','final_value','annualized_money_weighted','max_drawdown_portfolio','equal_capital_constant_final','timing_advantage_same_capital','events','max_episode_extra']}
          with open('backtests/drawdown_reserve_gold_btc_summary.json','w',encoding='utf-8') as f: json.dump(compact,f,ensure_ascii=False,indent=2)
      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/drawdown_reserve_gold_btc*.json
          git diff --cached --quiet || git commit -m 'Calcular backtest reserva por drawdown oro y Bitcoin'
          git push
