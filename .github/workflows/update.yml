name: Actualizar datos
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar series públicas
        run: |
          python - <<'PY'
          import csv,json,urllib.request,urllib.parse,time
          ids=['M2SL','FEDFUNDS','WALCL','T10Y2Y','BAA10Y','VIXCLS','GOLDAMGBD228NLBM','DEXUSEU','SP500']
          out={}
          for sid in ids:
              url='https://fred.stlouisfed.org/graph/fredgraph.csv?id='+urllib.parse.quote(sid)
              ok=False
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 radar-global'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          text=r.read().decode('utf-8')
                      rows=[]
                      for row in csv.DictReader(text.splitlines()):
                          try:
                              v=float(row[sid])
                              if v==v: rows.append({'date':row['observation_date'],'v':v})
                          except: pass
                      if rows:
                          out[sid]=rows[-260:]
                          ok=True
                          break
                  except Exception as e:
                      if attempt==2: print(sid,'ERROR',e)
                      time.sleep(2)
              print(sid, 'OK' if ok else 'FAILED')
          if len(out)<9:
              raise SystemExit(f'Solo se obtuvieron {len(out)}/9 series')
          with open('data.json','w',encoding='utf-8') as f: json.dump(out,f,separators=(',',':'))
          PY
      - name: Publicar datos
        run: |
          git config user.name 'radar-global-bot'
          git config user.email 'radar-global-bot@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m 'Actualizar datos del radar'
          git push
