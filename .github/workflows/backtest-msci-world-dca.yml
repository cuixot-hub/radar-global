name: Backtest transversal homogéneo índices
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular seis índices con contrato de datos único
        shell: python
        run: |
          import json, urllib.request, urllib.parse, datetime, statistics, os, math, traceback
          UA={'User-Agent':'Mozilla/5.0 radar-global homogeneous-final'}
          os.makedirs('backtests',exist_ok=True)
          SYMS={'SP500':'^GSPC','MSCI_WORLD':'^990100-USD-STRD','ACWI':'^892400-USD-STRD','NASDAQ100':'^NDX','EMERGING_MARKETS':'^891800-USD-STRD','SMALL_CAPS':'^RUT'}
          diag={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'contract':'Yahoo chart API; índices; USD; cierre mensual no ajustado; misma ventana exacta; mismos algoritmos','sources':{}}
          def monthly(sym):
            q=urllib.parse.quote(sym,safe='')
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{q}?period1=0&period2=1798761600&interval=1mo&includeAdjustedClose=false'
            req=urllib.request.Request(url,headers=UA)
            j=json.loads(urllib.request.urlopen(req,timeout=60).read().decode())
            if not j.get('chart',{}).get('result'): raise RuntimeError(str(j.get('chart',{}).get('error')))
            x=j['chart']['result'][0]; d={}
            for t,v in zip(x['timestamp'],x['indicators']['quote'][0]['close']):
              if v is None: continue
              m=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).strftime('%Y-%m'); d[m]=float(v)
            return [{'month':m,'price':d[m]} for m in sorted(d)]
          raw={}
          for k,s in SYMS.items():
            try:
              r=monthly(s); raw[k]=r; diag['sources'][k]={'symbol':s,'ok':True,'months':len(r),'start':r[0]['month'],'end':r[-1]['month']}
            except Exception as e:
              diag['sources'][k]={'symbol':s,'ok':False,'error':repr(e)}
          json.dump(diag,open('backtests/transversal_homogeneo_diagnostic.json','w'),ensure_ascii=False,indent=2)
          if len(raw)!=6: raise RuntimeError('No hay seis series válidas: '+json.dumps(diag['sources']))
          def classify(rows):
            vals=[r['price'] for r in rows]; out=[]
            for i,r in enumerate(rows):
              if i<13: continue
              ma10=sum(vals[i-9:i+1])/10; pct=(vals[i]/ma10-1)*100
              color='green' if pct>5 else 'yellow' if pct>=0 else 'red' if pct>=-5 else 'purple'
              tr12=vals[i-1]/vals[i-13]-1
              out.append({**r,'ma10':ma10,'pct':pct,'color':color,'trailing12_prev':tr12})
            return out
          full={k:classify(v) for k,v in raw.items()}
          common=sorted(set.intersection(*(set(x['month'] for x in v) for v in full.values())))
          def nxt(m):
            y,mo=map(int,m.split('-')); mo+=1
            if mo==13:y+=1;mo=1
            return f'{y:04d}-{mo:02d}'
          gaps=[(a,b) for a,b in zip(common,common[1:]) if nxt(a)!=b]
          if len(common)<120 or gaps: raise RuntimeError(f'Ventana común inválida meses={len(common)} gaps={gaps[:3]}')
          cm=set(common); data={k:[x for x in v if x['month'] in cm] for k,v in full.items()}
          def episodes(rows):
            eps=[]; active=False; cur=None
            for i,r in enumerate(rows):
              prev=rows[i-1]['color'] if i else None
              start=r['color'] in ('red','purple') and prev in ('green','yellow') and r['trailing12_prev']>0
              if not active and start: active=True; cur=[]
              if active:
                if r['color'] in ('red','purple'): cur.append(r)
                else:
                  if cur: eps.append(cur)
                  active=False; cur=None
            if active and cur: eps.append(cur)
            return eps
          def calc(rows):
            eps=episodes(rows); active={r['month'] for e in eps for r in e}
            units=inv=0; sig=[]
            for r in rows:
              b=100
              if r['month'] in active:
                b=125 if r['color']=='red' else 300; sig.append(r)
              units+=b/r['price']; inv+=b
            last=rows[-1]['price']; final=units*last; avg=inv/len(rows); eq=sum(avg/r['price'] for r in rows)*last
            details=[]
            for e in eps:
              red=sum(r['color']=='red' for r in e); purple=sum(r['color']=='purple' for r in e); extra=red*25+purple*200
              details.append({'start':e[0]['month'],'end':e[-1]['month'],'months':len(e),'red':red,'purple':purple,'reserve_extra_per_100_base':extra})
            worst=max(details,key=lambda x:x['reserve_extra_per_100_base']) if details else None
            return {'months':len(rows),'start':rows[0]['month'],'end':rows[-1]['month'],'episodes':len(details),'signals':len(sig),'red':sum(r['color']=='red' for r in sig),'purple':sum(r['color']=='purple' for r in sig),'max_duration':max((d['months'] for d in details),default=0),'timing_advantage_same_capital_pct':(final/eq-1)*100,'max_reserve_extra_per_100_base':worst['reserve_extra_per_100_base'] if worst else 0,'worst_episode':worst,'episodes_detail':details}
          res={k:calc(v) for k,v in data.items()}
          def corr(a,b):
            ra=[a[i]['price']/a[i-1]['price']-1 for i in range(1,len(a))]; rb=[b[i]['price']/b[i-1]['price']-1 for i in range(1,len(b))]
            ma=sum(ra)/len(ra); mb=sum(rb)/len(rb); num=sum((x-ma)*(y-mb) for x,y in zip(ra,rb)); da=sum((x-ma)**2 for x in ra); db=sum((y-mb)**2 for y in rb)
            return num/math.sqrt(da*db)
          checks={'same_month_count':len(set(v['months'] for v in res.values()))==1,'same_start':len(set(v['start'] for v in res.values()))==1,'same_end':len(set(v['end'] for v in res.values()))==1,'common_months':len(common),'common_start':common[0],'common_end':common[-1],'sp500_msci_corr_monthly_returns':corr(data['SP500'],data['MSCI_WORLD'])}
          if not all(checks[k] for k in ['same_month_count','same_start','same_end']): raise RuntimeError('Homogeneidad fallida '+repr(checks))
          out={'generated_at':diag['generated_at'],'contract':diag['contract'],'symbols':SYMS,'method':'MA10 mensual ±5%; filtro 12m; 100/125/300; reserva=extra; mismo capital','checks':checks,'results':res}
          json.dump(out,open('backtests/transversal_homogeneo_final.json','w'),ensure_ascii=False,indent=2)
          summary={'generated_at':out['generated_at'],'contract':out['contract'],'symbols':SYMS,'method':out['method'],'checks':checks,'results':{k:{q:v[q] for q in ['months','start','end','episodes','signals','red','purple','max_duration','timing_advantage_same_capital_pct','max_reserve_extra_per_100_base','worst_episode']} for k,v in res.items()}}
          json.dump(summary,open('backtests/transversal_homogeneo_final_summary.json','w'),ensure_ascii=False,indent=2)
      - name: Guardar diagnóstico y resultados
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/transversal_homogeneo_diagnostic.json backtests/transversal_homogeneo_final.json backtests/transversal_homogeneo_final_summary.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Backtest transversal homogéneo final'
          git push