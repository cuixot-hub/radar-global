name: Backtest BTC recuperación semanal
on:
  push:
    paths:
      - '.github/workflows/backtest-gold-btc-dca.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular BTC rojo/morado + recuperación semanal
        shell: python
        run: |
          import json, urllib.request, urllib.parse, datetime, math, statistics

          UA={'User-Agent':'Mozilla/5.0 radar-global backtest'}
          NOW=datetime.datetime.now(datetime.timezone.utc)
          CUR_MONTH=NOW.strftime('%Y-%m')
          CUR_ISO=NOW.date().isoformat()

          def get_chart(interval):
            p1=int(datetime.datetime(2014,1,1,tzinfo=datetime.timezone.utc).timestamp())
            p2=int(NOW.timestamp())
            q=urllib.parse.quote('BTC-USD',safe='')
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{q}?period1={p1}&period2={p2}&interval={interval}&includeAdjustedClose=true&events=div%2Csplits'
            req=urllib.request.Request(url,headers=UA)
            j=json.loads(urllib.request.urlopen(req,timeout=30).read().decode())['chart']['result'][0]
            ts=j['timestamp']; quote=j['indicators']['quote'][0]['close']
            adj=(j['indicators'].get('adjclose') or [{}])[0].get('adjclose') or quote
            out=[]
            for t,a,c in zip(ts,adj,quote):
              v=a if a is not None else c
              if v is None: continue
              d=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).date()
              out.append((d,float(v)))
            return out

          monthly_raw=get_chart('1mo')
          weekly_raw=get_chart('1wk')

          # Solo meses cerrados. Deduplicar por YYYY-MM conservando la última observación.
          md={}
          for d,v in monthly_raw:
            ym=d.strftime('%Y-%m')
            if ym>=CUR_MONTH: continue
            md[ym]=(d,v)
          months=[(ym,md[ym][0],md[ym][1]) for ym in sorted(md)]

          # Semanas cerradas: Yahoo etiqueta el inicio de semana. Consideramos cerrada si han pasado >=7 días.
          weeks=[]
          for d,v in weekly_raw:
            if (NOW.date()-d).days < 7: continue
            weeks.append((d,v))
          weeks.sort()

          # Maestro mensual: MA10 + banda max(5%,1.25*vol mensual 24m).
          vals=[]; signals=[]
          for ym,d,p in months:
            vals.append(p)
            if len(vals)<25: continue
            ma10=sum(vals[-10:])/10
            rets=[(vals[i]/vals[i-1]-1)*100 for i in range(max(1,len(vals)-24),len(vals))]
            vol=statistics.stdev(rets) if len(rets)>=2 else 0.0
            band=max(5.0,1.25*vol)
            pct=(p/ma10-1)*100
            color='green' if pct>band else 'yellow' if pct>=0 else 'red' if pct>=-band else 'purple'
            signals.append({'month':ym,'date':d.isoformat(),'price':p,'ma10':ma10,'pct':pct,'band':band,'color':color})

          # Homogeneizar desde 2016-10 y hasta último mes cerrado.
          signals=[s for s in signals if s['month']>='2016-10']
          sig_by_month={s['month']:s for s in signals}
          valid_months=[m for m in months if m[0] in sig_by_month]
          start=valid_months[0][0]; end=valid_months[-1][0]

          def next_month(ym):
            y,m=map(int,ym.split('-'))
            if m==12: return f'{y+1:04d}-01'
            return f'{y:04d}-{m+1:02d}'

          def weekly_recovery(source_month, mode):
            target=next_month(source_month)
            idxs=[i for i,(d,p) in enumerate(weeks) if d.strftime('%Y-%m')==target]
            for i in idxs:
              if i<1: continue
              r1=weeks[i][1] > weeks[i-1][1]
              if mode=='1w' and r1:
                return weeks[i]
              if mode=='2w' and i>=2 and r1 and weeks[i-1][1] > weeks[i-2][1]:
                return weeks[i]
            return None

          def eval_strategy(kind):
            buys=[]
            # DCA base mensual siempre.
            for ym,d,p in valid_months:
              buys.append((d,p,25.0,'base'))
            reinforced=0
            if kind=='master':
              for ym,d,p in valid_months:
                c=sig_by_month[ym]['color']
                extra=12.5 if c=='red' else 25.0 if c=='purple' else 0.0
                if extra:
                  buys.append((d,p,extra,c)); reinforced+=1
            elif kind in ('1w','2w'):
              for ym,d,p in valid_months:
                c=sig_by_month[ym]['color']
                extra=12.5 if c=='red' else 25.0 if c=='purple' else 0.0
                if not extra: continue
                rec=weekly_recovery(ym,kind)
                if rec:
                  rd,rp=rec
                  buys.append((rd,rp,extra,c+'_'+kind)); reinforced+=1
            invested=sum(a for _,_,a,_ in buys)
            final_price=valid_months[-1][2]
            shares=sum(a/p for _,p,a,_ in buys)
            final_value=shares*final_price
            const=invested/len(valid_months)
            const_shares=sum(const/p for _,_,p in valid_months)
            equal_final=const_shares*final_price
            adv=final_value/equal_final-1 if equal_final else 0
            # Portfolio drawdown con valoración mensual; sólo compras ocurridas hasta cada fecha.
            peak=None; maxdd=0.0
            for ym,d,p in valid_months:
              sh=sum(a/bp for bd,bp,a,_ in buys if bd<=d)
              val=sh*p
              if peak is None or val>peak: peak=val
              if peak and peak>0: maxdd=min(maxdd,val/peak-1)
            return {'invested':invested,'final_value':final_value,'equal_capital_constant_final':equal_final,'timing_advantage_same_capital':adv,'max_drawdown_portfolio':maxdd,'reinforced_months':reinforced}

          out={
            'generated_at':NOW.isoformat(),
            'method':'BTC: DCA base 25 mensual. Maestro técnico mensual MA10+banda. Refuerzo sólo si mes cerrado rojo/morado y en el mes siguiente aparece recuperación semanal. 1w=una semana positiva; 2w=dos semanas positivas consecutivas. Rojo extra 12,5; morado extra 25. Comparación a igual capital.',
            'period':{'start':start,'end':end,'months':len(valid_months)},
            'base25':eval_strategy('base'),
            'master_actual_cerrado':eval_strategy('master'),
            'recovery_1w':eval_strategy('1w'),
            'recovery_2w':eval_strategy('2w')
          }
          with open('backtests/btc_recovery_filter_summary.json','w',encoding='utf-8') as f:
            json.dump(out,f,indent=2,ensure_ascii=False)

      - name: Guardar resultado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/btc_recovery_filter_summary.json
          git commit -m 'Resultado backtest BTC recuperacion semanal' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
