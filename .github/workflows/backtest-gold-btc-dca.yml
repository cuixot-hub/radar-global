name: Backtest DCA Oro y Bitcoin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backtest-gold-btc-dca.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular backtest mensual GLD y BTC
        shell: python
        run: |
          import json, urllib.request, urllib.parse, datetime, statistics, os
          UA={'User-Agent':'Mozilla/5.0 radar-global backtest'}
          def get_json(url):
            req=urllib.request.Request(url,headers=UA)
            return json.loads(urllib.request.urlopen(req,timeout=60).read().decode())
          def monthly(symbol):
            q=urllib.parse.quote(symbol,safe='')
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{q}?period1=0&period2=1798761600&interval=1mo&includeAdjustedClose=true&events=div%2Csplits'
            j=get_json(url)['chart']['result'][0]
            ts=j['timestamp']; close=j['indicators']['quote'][0]['close']; adj=(j['indicators'].get('adjclose') or [{}])[0].get('adjclose') or close
            out=[]
            for t,a,c in zip(ts,adj,close):
              v=a if a is not None else c
              if v is None: continue
              out.append({'month':datetime.datetime.fromtimestamp(t,datetime.timezone.utc).strftime('%Y-%m'),'price':float(v)})
            return out
          def colors(rows):
            vals=[x['price'] for x in rows]; out=[]
            for i,x in enumerate(rows):
              if i<24: continue
              hist=vals[:i+1]; ma10=sum(hist[-10:])/10
              rets=[(hist[k]/hist[k-1]-1)*100 for k in range(1,len(hist))]
              vol=statistics.stdev(rets[-24:]); band=max(5.0,1.25*vol); pct=(x['price']/ma10-1)*100
              c='green' if pct>band else 'yellow' if pct>=0 else 'red' if pct>=-band else 'purple'
              buy=25.0 if c in ('green','yellow') else 37.5 if c=='red' else 50.0
              out.append({**x,'ma10':ma10,'pct':pct,'band':band,'color':c,'buy':buy})
            return out
          def irr(cfs):
            lo,hi=-.999,10.0
            def npv(r): return sum(cf/((1+r)**i) for i,cf in enumerate(cfs))
            for _ in range(180):
              mid=(lo+hi)/2
              if npv(mid)>0: lo=mid
              else: hi=mid
            return (1+(lo+hi)/2)**12-1
          def calc(symbol):
            rows=colors(monthly(symbol)); last=rows[-1]['price']
            def strat(dynamic):
              units=invested=0; vals=[]; cfs=[]
              for r in rows:
                b=r['buy'] if dynamic else 25.0
                units+=b/r['price']; invested+=b; vals.append(units*r['price']); cfs.append(-b)
              final=units*last; cfs[-1]+=final; peak=vals[0]; mdd=0
              for v in vals: peak=max(peak,v); mdd=min(mdd,v/peak-1)
              return {'invested':invested,'final_value':final,'gain':final-invested,'annualized_money_weighted':irr(cfs),'max_drawdown_portfolio':mdd}
            simple=strat(False); dyn=strat(True); avg=dyn['invested']/len(rows)
            equal_final=sum(avg/r['price'] for r in rows)*last
            return {'symbol':symbol,'start':rows[0]['month'],'end':rows[-1]['month'],'months':len(rows),'colors':{c:sum(r['color']==c for r in rows) for c in ['green','yellow','red','purple']},'simple25':simple,'dynamic':dyn,'dynamic_avg_monthly':avg,'equal_capital_constant_final':equal_final,'timing_advantage_same_capital':dyn['final_value']/equal_final-1,'rows':rows}
          g=calc('GLD'); b=calc('BTC-USD')
          payload={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'method':'MA10 mensual + banda adaptada=max(5%,1.25*vol mensual 24m); 25 normal, 37.5 rojo, 50 morado','GLD':g,'BTC':b}
          summary={'generated_at':payload['generated_at'],'method':payload['method']}
          for k,x in [('GLD',g),('BTC',b)]:
            summary[k]={q:x[q] for q in ['start','end','months','colors','simple25','dynamic','dynamic_avg_monthly','equal_capital_constant_final','timing_advantage_same_capital']}
          os.makedirs('backtests',exist_ok=True)
          with open('backtests/gold_btc_dca.json','w',encoding='utf-8') as f: json.dump(payload,f,ensure_ascii=False,separators=(',',':'))
          with open('backtests/gold_btc_dca_summary.json','w',encoding='utf-8') as f: json.dump(summary,f,ensure_ascii=False,indent=2)
      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/gold_btc_dca.json backtests/gold_btc_dca_summary.json
          git diff --cached --quiet || git commit -m 'Calcular backtest DCA oro y Bitcoin'
          git push
