name: Estudio escalones oro y bitcoin
on:
  push:
    paths:
      - '.github/workflows/backtest-gold-btc-dca.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Calcular caidas y escalones
        run: |
          python - <<'PY'
          import json, math, statistics, urllib.request, urllib.parse, datetime, time, os

          EPISODES = [
            ('COVID','2020-02-17','2020-04-30'),
            ('UCRANIA','2022-02-14','2022-04-30'),
            ('ISRAEL_HAMAS','2023-10-02','2023-11-30'),
            ('MAR_ROJO','2023-12-11','2024-03-31'),
            ('IRAN_ISRAEL_2024','2024-04-01','2024-05-31'),
            ('HORMUZ_2026','2026-03-01','2026-08-20'),
          ]
          SYMBOLS={'GLD':'GLD','BTC':'BTC-USD'}

          def ts(s):
            return int(datetime.datetime.strptime(s,'%Y-%m-%d').replace(tzinfo=datetime.timezone.utc).timestamp())

          def yahoo_daily(symbol,start='2019-01-01',end='2026-08-21'):
            url=(f'https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(symbol)}'
                 f'?period1={ts(start)}&period2={ts(end)}&interval=1d&events=history&includeAdjustedClose=true')
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)['chart']['result'][0]
            stamps=data['timestamp']; q=data['indicators']['quote'][0]
            adj=data.get('indicators',{}).get('adjclose',[{}])[0].get('adjclose')
            vals=adj if adj else q['close']
            out=[]
            for t,v in zip(stamps,vals):
              if v is None: continue
              d=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).date()
              out.append((d,float(v)))
            return out

          def percentile(xs,p):
            xs=sorted(xs)
            if not xs: return None
            if len(xs)==1: return xs[0]
            k=(len(xs)-1)*p
            f=math.floor(k); c=math.ceil(k)
            if f==c:return xs[int(k)]
            return xs[f]*(c-k)+xs[c]*(k-f)

          def round_up(x,step):
            return math.ceil(x/step-1e-12)*step

          result={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'method':'Caida desde maximo de cierre en 30 dias anteriores al evento. Se mide drawdown maximo dentro del episodio. Escalones derivados de caida tipica = media y mediana de episodios con caida positiva; oro 3 tramos a 1/3,2/3,1x; BTC 4 tramos a 1/4,1/2,3/4,1x. Redondeo conservador: oro 2,5pp; BTC 5pp. Sin optimizacion.',
                  'episodes':{},'assets':{}}

          for key,sym in SYMBOLS.items():
            rows=yahoo_daily(sym)
            bydate=dict(rows)
            details=[]; maxdds=[]
            for name,s0,s1 in EPISODES:
              start=datetime.date.fromisoformat(s0); end=datetime.date.fromisoformat(s1)
              pre0=start-datetime.timedelta(days=30)
              pre=[(d,v) for d,v in rows if pre0<=d<start]
              ev=[(d,v) for d,v in rows if start<=d<=end]
              if not pre or not ev: continue
              peakd,peak=max(pre,key=lambda x:x[1])
              mind,minv=min(ev,key=lambda x:x[1])
              dd=max(0.0,(peak-minv)/peak*100)
              maxdds.append(dd)
              details.append({'event':name,'pre_peak_date':str(peakd),'pre_peak':peak,'trough_date':str(mind),'trough':minv,'max_drawdown_pct':dd})
            mean=statistics.mean(maxdds); median=statistics.median(maxdds)
            typical=(mean+median)/2
            if key=='GLD':
              raw=[typical/3,2*typical/3,typical]
              levels=[round_up(x,2.5) for x in raw]
              # enforce distinct
              for i in range(1,len(levels)):
                if levels[i]<=levels[i-1]: levels[i]=levels[i-1]+2.5
              allocation=[25,30,45]
            else:
              raw=[typical/4,typical/2,3*typical/4,typical]
              levels=[round_up(x,5.0) for x in raw]
              for i in range(1,len(levels)):
                if levels[i]<=levels[i-1]: levels[i]=levels[i-1]+5.0
              allocation=[15,20,25,40]
            result['assets'][key]={
              'episodes':details,
              'drawdown_stats_pct':{
                'mean':mean,'median':median,
                'p25':percentile(maxdds,.25),'p50':percentile(maxdds,.50),'p75':percentile(maxdds,.75),
                'min':min(maxdds),'max':max(maxdds),'typical_mean_median_avg':typical
              },
              'candidate_entry_drawdowns_pct':levels,
              'candidate_reserve_allocation_pct':allocation
            }
            time.sleep(1)

          os.makedirs('backtests',exist_ok=True)
          with open('backtests/geopolitical_drawdown_ladder_summary.json','w',encoding='utf-8') as f:
            json.dump(result,f,ensure_ascii=False,indent=2)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Guardar resultado
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add backtests/geopolitical_drawdown_ladder_summary.json
          git diff --cached --quiet || git commit -m "Guardar estudio de escalones geopolíticos oro y bitcoin"
          git push
