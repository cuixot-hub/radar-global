name: Backtest DCA Oro y Bitcoin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backtest-gold-btc-dca.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular backtest mensual GLD y BTC
        shell: python
        run: |
          import json, urllib.request, urllib.parse, datetime, statistics, math, os
          UA={'User-Agent':'Mozilla/5.0 radar-global backtest'}
          def get_json(url):
            req=urllib.request.Request(url,headers=UA)
            return json.loads(urllib.request.urlopen(req,timeout=60).read().decode())
          def monthly(symbol):
            q=urllib.parse.quote(symbol,safe='')
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{q}?period1=0&period2=1798761600&interval=1mo&includeAdjustedClose=true&events=div%2Csplits'
            j=get_json(url)['chart']['result'][0]
            ts=j['timestamp']; close=j['indicators']['quote'][0]['close']; adj=(j['indicators'].get('adjclose') or [{}])[0].get('adjclose') or close
            out=[]
            for t,a,c in zip(ts,adj,close):
              v=a if a is not None else c
              if v is None: continue
              d=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).strftime('%Y-%m')
              out.append({'month':d,'price':float(v)})
            return out
          def colors(rows):
            vals=[x['price'] for x in rows]
            out=[]
            for i,x in enumerate(rows):
              if i<24 or i<9: continue
              hist=vals[:i+1]
              ma10=sum(hist[-10:])/10
              rets=[(hist[k]/hist[k-1]-1)*100 for k in range(1,len(hist))]
              vol=statistics.stdev(rets[-24:]) if len(rets)>=24 else statistics.stdev(rets)
              band=max(5.0,1.25*vol)
              pct=(x['price']/ma10-1)*100
              c='green' if pct>band else 'yellow' if pct>=0 else 'red' if pct>=-band else 'purple'
              buy=25.0 if c in ('green','yellow') else 37.5 if c=='red' else 50.0
              out.append({**x,'ma10':ma10,'pct':pct,'band':band,'color':c,'buy':buy})
            return out
          def xirr(cfs):
            # monthly periodic IRR by bisection; final value added to last month
            lo,hi=-0.999,10.0
            def npv(r): return sum(cf/((1+r)**i) for i,cf in enumerate(cfs))
            for _ in range(200):
              mid=(lo+hi)/2
              if npv(mid)>0: lo=mid
              else: hi=mid
            return ((1+(lo+hi)/2)**12)-1
          def calc(symbol):
            rows=colors(monthly(symbol))
            last=rows[-1]['price']
            def strategy(dynamic):
              units=0; invested=0; vals=[]; contrib=[]
              for r in rows:
                b=r['buy'] if dynamic else 25.0
                units += b/r['price']; invested+=b
                vals.append(units*r['price'])
                contrib.append(-b)
              final=units*last
              contrib[-1]+=final
              peak=vals[0]; mdd=0
              for v in vals:
                peak=max(peak,v); mdd=min(mdd,v/peak-1)
              return {'invested':invested,'final_value':final,'gain':final-invested,'return_on_contributions':final/invested-1,'annualized_money_weighted':xirr(contrib),'max_drawdown_portfolio':mdd}
            simple=strategy(False); dyn=strategy(True)
            colors_count={c:sum(r['color']==c for r in rows) for c in ['green','yellow','red','purple']}
            # equal-capital control: constant monthly amount equal to dynamic average
            avg=dyn['invested']/len(rows); units=sum(avg/r['price'] for r in rows); equal_final=units*last
            return {'symbol':symbol,'start':rows[0]['month'],'end':rows[-1]['month'],'months':len(rows),'colors':colors_count,'simple25':simple,'dynamic_25_37_5_50':dyn,'dynamic_avg_monthly':avg,'equal_capital_constant_final':equal_final,'timing_advantage_same_capital':dyn['final_value']/equal_final-1,'rows':rows}
          payload={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'method':'MA10 mensual + banda adaptada=max(5%,1.25*vol mensual 24m). Compra 25 normal/amarillo, 37.5 rojo, 50 morado.','GLD':calc('GLD'),'BTC':calc('BTC-USD')}
          os.makedirs('backtests',exist_ok=True)
          with open('backtests/gold_btc_dca.json','w',encoding='utf-8') as f: json.dump(payload,f,ensure_ascii=False,separators=(',',':'))
      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/gold_btc_dca.json
          git diff --cached --quiet || git commit -m 'Calcular backtest DCA oro y Bitcoin'
          git push
