name: Backtest liquidacion forzada oro y bitcoin (una vez)
on:
  push:
    paths:
      - '.github/workflows/backtest-gold-btc-dca.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backtest
        run: |
          python - <<'PY'
          import json, math, statistics, urllib.request
          from datetime import datetime, timezone

          def yahoo(symbol):
              u=f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?period1=1451606400&period2=1798761600&interval=1wk&events=history&includeAdjustedClose=true'
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r: j=json.load(r)
              x=j['chart']['result'][0]; ts=x['timestamp']; q=x['indicators']['quote'][0]; adj=x['indicators'].get('adjclose',[{}])[0].get('adjclose')
              out=[]
              for i,t in enumerate(ts):
                  v=(adj[i] if adj and i<len(adj) else q['close'][i])
                  if v is not None: out.append((datetime.fromtimestamp(t,timezone.utc).date().isoformat(),float(v)))
              return out

          S={s:yahoo(s) for s in ['SPY','GLD','TLT','BTC-USD','DX-Y.NYB','^VIX']}
          # align on SPY dates using most recent observation at/before each date
          def val(series,d):
              z=[v for dd,v in series if dd<=d]
              return z[-1] if z else None

          events=[
            ('COVID','2020-02-17','2020-04-30'),
            ('UCRANIA','2022-02-14','2022-04-30'),
            ('ISRAEL_HAMAS','2023-10-02','2023-11-30'),
            ('MAR_ROJO','2023-12-11','2024-03-31'),
            ('IRAN_ISRAEL_2024','2024-04-01','2024-05-31'),
            ('HORMUZ_2026','2026-03-01','2026-08-20')]

          dates=[d for d,_ in S['SPY']]
          rows=[]
          prev={}
          for d in dates:
              cur={k:val(v,d) for k,v in S.items()}
              if all(cur[k] is not None for k in cur) and prev:
                  rets={k:cur[k]/prev[k]-1 for k in cur}
                  falling=sum(rets[k]<0 for k in ['SPY','GLD','TLT','BTC-USD'])
                  cash=(falling>=3 and rets['DX-Y.NYB']>0 and rets['^VIX']>0)
                  rows.append({'date':d,'ret':rets,'falling':falling,'cash':cash,'px':cur.copy()})
              prev=cur

          def in_event(d,a,b): return a<=d<=b
          detections=[]
          for name,a,b in events:
              rr=[r for r in rows if in_event(r['date'],a,b)]
              sig=[r for r in rr if r['cash']]
              detections.append({'event':name,'start':a,'end':b,'signal_weeks':len(sig),'first_signal':sig[0]['date'] if sig else None})

          # deploy 100 reserve per event only if signal exists: 25 first signal, 25 next signal, 50 first later positive week for asset after last signal.
          def strategy(asset):
              buys=[]; total_extra=0
              for name,a,b in events:
                  rr=[r for r in rows if in_event(r['date'],a,b)]
                  sig=[r for r in rr if r['cash']]
                  if not sig: continue
                  total_extra+=100
                  buys.append((sig[0]['date'],25,sig[0]['px'][asset],name,'tramo1'))
                  if len(sig)>=2:
                      buys.append((sig[1]['date'],25,sig[1]['px'][asset],name,'tramo2'))
                      rem=50
                  else:
                      rem=75
                  last=sig[-1]['date']
                  recovery=next((r for r in rr if r['date']>last and r['ret'][asset]>0),None)
                  if recovery: buys.append((recovery['date'],rem,recovery['px'][asset],name,'recuperacion'))
                  else: buys.append((sig[-1]['date'],rem,sig[-1]['px'][asset],name,'remanente'))
              endpx=S[asset][-1][1]
              shares=sum(e/p for _,e,p,_,_ in buys)
              final=shares*endpx
              # equal-capital comparator: same extra capital spread uniformly over all weekly rows in asset sample
              if total_extra:
                  per=total_extra/len(rows)
                  constshares=sum(per/r['px'][asset] for r in rows)
                  constfinal=constshares*endpx
                  adv=final/constfinal-1
              else: constfinal=final=adv=0
              return {'extra_invested':total_extra,'final_value_extra':final,'equal_capital_uniform_final':constfinal,'timing_advantage_same_capital':adv,'buys':buys}

          out={'generated_at':datetime.now(timezone.utc).isoformat(),
               'method':'Episodios predefinidos. Liquidacion forzada proxy semanal = al menos 3 de SPY/GLD/TLT/BTC caen + DXY sube + VIX sube. Reserva 100 por episodio: 25% primera semana de señal, 25% segunda semana de señal, resto en primera semana posterior con retorno positivo del activo. Comparación a igual capital contra reserva distribuida uniformemente.',
               'episodes':detections,'GLD':strategy('GLD'),'BTC':strategy('BTC-USD')}
          import os
          os.makedirs('backtests',exist_ok=True)
          with open('backtests/forced_liquidation_accumulation_summary.json','w') as f: json.dump(out,f,indent=2)
          PY
      - name: Guardar resultado
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add backtests/forced_liquidation_accumulation_summary.json
          git commit -m "Backtest acumulacion en liquidacion forzada" || exit 0
          git push
