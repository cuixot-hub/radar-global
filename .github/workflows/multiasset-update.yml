name: Actualizar Semaforo Multi-Activo
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write

concurrency:
  group: multiasset-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular maestros multi-activo
        continue-on-error: true
        shell: python
        run: |
          import json, urllib.request, urllib.parse, csv, io, time, datetime, statistics, math

          UA={'User-Agent':'Mozilla/5.0 radar-global multiasset'}

          def get_json(url,tries=2):
            last=None
            for i in range(tries):
              try:
                req=urllib.request.Request(url,headers=UA)
                return json.loads(urllib.request.urlopen(req,timeout=15).read().decode('utf-8'))
              except Exception as e:
                last=e; time.sleep(1+i)
            raise last

          def fred(sid):
            url='https://fred.stlouisfed.org/graph/fredgraph.csv?id='+sid
            req=urllib.request.Request(url,headers=UA)
            raw=urllib.request.urlopen(req,timeout=15).read().decode('utf-8-sig')
            arr=[]
            for r in csv.DictReader(io.StringIO(raw)):
              d=r.get('observation_date') or r.get('DATE') or r.get('date')
              try:
                v=float(r[sid])
                if d and math.isfinite(v): arr.append({'date':d,'v':v})
              except: pass
            if not arr: raise RuntimeError('Sin datos FRED '+sid)
            return arr

          fids=['DFF','M2SL','T10Y2Y','CPIAUCSL','DGS10','DGS20','DGS30','DCOILWTICO','PPIACO','VIXCLS','BAMLH0A0HYM2','DFII10','NFCI','DTWEXBGS']
          F={}
          for sid in fids:
            F[sid]=fred(sid); time.sleep(.1)

          def last(s): return F[s][-1]
          def yoy(s): return (F[s][-1]['v']/F[s][-13]['v']-1)*100
          def score_color(x): return 'green' if x<.75 else 'yellow' if x<1.5 else 'red' if x<2.25 else 'purple'
          def cname(c): return {'green':'VERDE','yellow':'AMARILLO','red':'ROJO','purple':'MORADO'}[c]
          def n(x,d=2): return f'{x:.{d}f}'.replace('.',',')

          fed=last('DFF')['v']; m2y=yoy('M2SL'); curve=last('T10Y2Y')['v']
          sf=0 if fed<1 else 1 if fed<3 else 2 if fed<5 else 3
          sm=0 if m2y>10 else 1 if m2y>5 else 2 if m2y>0 else 3
          sc=0 if curve>1 else 1 if curve>=0 else 2 if curve>=-.5 else 3
          b1=(sf+sm+sc)/3; c1=score_color(b1)

          cpiy=yoy('CPIAUCSL'); g10=last('DGS10')['v']; g20=last('DGS20')['v']; g30=last('DGS30')['v']; wti=last('DCOILWTICO')['v']; ppiy=yoy('PPIACO')
          s_cpi=0 if cpiy<2.5 else 1 if cpiy<3.5 else 2 if cpiy<5 else 3
          s_g10=0 if g10<3 else 1 if g10<4 else 2 if g10<5 else 3
          s_wti=0 if wti<70 else 1 if wti<90 else 2 if wti<110 else 3
          s_ppi=0 if ppiy<3 else 1 if ppiy<5 else 2 if ppiy<8 else 3
          b2=(s_cpi+s_g10+(s_wti+s_ppi)/2)/3; c2=score_color(b2)

          vix=last('VIXCLS')['v']; hy=last('BAMLH0A0HYM2')['v']; real=last('DFII10')['v']; nfci=last('NFCI')['v']; dollar=last('DTWEXBGS')['v']
          sv=0 if vix<15 else 1 if vix<25 else 2 if vix<35 else 3
          sh=0 if hy<3.5 else 1 if hy<5 else 2 if hy<6 else 3
          sr=0 if real<.75 else 1 if real<2 else 2 if real<2.5 else 3
          sn=0 if nfci<-.5 else 1 if nfci<0 else 2 if nfci<.1 else 3
          b5=(sv+sh+sr+sn)/4; c5=score_color(b5)
          macro={'B1':{'color':c1,'state':cname(c1)},'B2':{'color':c2,'state':cname(c2)},'B5':{'color':c5,'state':cname(c5)}}

          def yahoo_monthly(symbol):
            q=urllib.parse.quote(symbol,safe='')
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{q}?range=3y&interval=1mo&includeAdjustedClose=true&events=div%2Csplits'
            j=get_json(url)['chart']['result'][0]
            ts=j['timestamp']; quote=j['indicators']['quote'][0]['close']
            adj=(j['indicators'].get('adjclose') or [{}])[0].get('adjclose') or quote
            rows=[]
            for t,a,c in zip(ts,adj,quote):
              v=a if a is not None else c
              if v is None: continue
              d=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).date().isoformat()
              rows.append({'date':d,'v':float(v)})
            if len(rows)<25: raise RuntimeError('Pocos datos '+symbol)
            return rows

          def master(symbol,key):
            rows=yahoo_monthly(symbol)
            vals=[x['v'] for x in rows]
            cur=vals[-1]; ma10=sum(vals[-10:])/10; pct=(cur/ma10-1)*100
            rets=[(vals[i]/vals[i-1]-1)*100 for i in range(1,len(vals))]
            vol=statistics.stdev(rets[-24:]) if len(rets)>=24 else statistics.stdev(rets)
            band=max(5.0,1.25*vol)
            if pct>band: c='green'
            elif pct>=0: c='yellow'
            elif pct>=-band: c='red'
            else: c='purple'
            action={'green':'DCA NORMAL','yellow':'DCA NORMAL · VIGILAR','red':'DCA + REFUERZO','purple':'DCA + REFUERZO FUERTE'}[c]
            return {'key':key,'color':c,'state':cname(c),'action':action,'price':cur,'ma10':ma10,'pct':pct,'band':band,'date':rows[-1]['date']}

          specs=[('ACWI','ACWI'),('TLT','TLT'),('GLD','GLD'),('BTC-USD','BTC')]
          A={}
          for sym,key in specs:
            a=master(sym,key)
            a['metrics']=f"Precio {n(a['price'])} · vs MA10 {n(a['pct'])}% · {a['date']}"
            if key=='ACWI':
              a['context']=f"Macro: liquidez {cname(c1)} · inflación/costes {cname(c2)} · riesgo {cname(c5)}."
              a['important']='B3 manda: el macro acompaña, no veta la compra.' if a['color'] in ('red','purple') else ''
            elif key=='TLT':
              a['context']=f"10Y {n(g10)}% · 20Y {n(g20)}% · 30Y {n(g30)}% · CPI {n(cpiy)}%."
              a['important']='Tipos largos ≥5%: rentabilidad de entrada elevada, pero duración sensible.' if g20>=5 or g30>=5 else ''
            elif key=='GLD':
              a['context']=f"Tipo real 10Y {n(real)}% · dólar amplio {n(dollar)} · CPI {n(cpiy)}%."
              a['important']='Tipos reales y dólar son contexto clave para el oro.' if a['color'] in ('red','purple') else ''
            else:
              a['context']=f"M2 YoY {n(m2y)}% · tipo real 10Y {n(real)}% · VIX {n(vix)}."
              a['important']='Bitcoin usa umbral adaptado a su volatilidad; morado no significa suelo.' if a['color'] in ('red','purple') else ''
            for z in ['price','ma10','pct','band','date','key']: a.pop(z,None)
            A[key]=a
            time.sleep(.3)

          payload={'status':'OK','generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'method':'B3 MA10 con banda adaptada a volatilidad mensual; DCA base siempre, refuerzo sólo con reserva','macro':macro,'assets':A}
          with open('multiasset/data.json','w',encoding='utf-8') as f: json.dump(payload,f,separators=(',',':'),ensure_ascii=False)

      - name: Publicar snapshot sin carreras
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multiasset/data.json
          if git diff --cached --quiet; then
            echo 'Sin snapshot nuevo: se conserva el último válido.'
            exit 0
          fi
          git commit -m 'Actualizar Semaforo Multi-Activo'
          git pull --rebase origin main
          git push origin HEAD:main
