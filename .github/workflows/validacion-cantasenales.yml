name: Validación cantaseñales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validacion-cantasenales.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular validación
        shell: python
        run: |
          import json, urllib.request, urllib.parse, datetime, statistics, math, os
          UA={'User-Agent':'Mozilla/5.0 radar-global signal-validator'}
          EQUITY={'SP500':'SPY','MSCI_WORLD':'URTH','ACWI':'ACWI','NASDAQ100':'QQQ','EMERGING':'EEM','SMALL_CAPS':'IWM'}
          ALT={'GOLD':'GLD','BITCOIN':'BTC-USD'}
          def yahoo_monthly(symbol):
            q=urllib.parse.quote(symbol,safe='')
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{q}?period1=0&period2=1798761600&interval=1mo&includeAdjustedClose=true&events=div%2Csplits'
            req=urllib.request.Request(url,headers=UA)
            j=json.loads(urllib.request.urlopen(req,timeout=60).read().decode())['chart']['result'][0]
            ts=j['timestamp']; quote=j['indicators']['quote'][0]['close']
            adj=(j.get('indicators',{}).get('adjclose') or [{}])[0].get('adjclose')
            vals=adj if adj and len(adj)==len(ts) else quote
            d={}
            for t,v in zip(ts,vals):
              if v is None: continue
              m=datetime.datetime.fromtimestamp(t,datetime.timezone.utc).strftime('%Y-%m')
              d[m]=float(v)
            return [{'month':m,'price':d[m]} for m in sorted(d)]
          def classify(raw):
            vals=[r['price'] for r in raw]; out=[]
            for i,r in enumerate(raw):
              if i<13: continue
              ma10=sum(vals[i-9:i+1])/10
              pct=(r['price']/ma10-1)*100
              color='green' if pct>5 else 'yellow' if pct>=0 else 'red' if pct>=-5 else 'purple'
              tr12=vals[i-1]/vals[i-13]-1
              out.append({**r,'color':color,'pct':pct,'tr12prev':tr12})
            return out
          def episodes(rows):
            eps=[]; active=False; cur=None
            for i,r in enumerate(rows):
              prev=rows[i-1]['color'] if i else None
              start=(r['color'] in ('red','purple') and prev in ('green','yellow') and r['tr12prev']>0)
              if not active and start: active=True; cur={'start':r['month'],'rows':[]}
              if active:
                if r['color'] in ('red','purple'): cur['rows'].append(r)
                else:
                  if cur['rows']: eps.append(cur)
                  active=False; cur=None
            if active and cur and cur['rows']: eps.append(cur)
            return eps
          def dca_result(rows):
            eps=episodes(rows); act={x['month'] for e in eps for x in e['rows']}
            units=invested=0.0; sig=[]
            for r in rows:
              buy=100.0
              if r['month'] in act:
                buy=125.0 if r['color']=='red' else 300.0; sig.append(r)
              units+=buy/r['price']; invested+=buy
            last=rows[-1]['price']; final=units*last; avg=invested/len(rows)
            eq=sum(avg/r['price'] for r in rows)*last
            reserves=[]
            for e in eps:
              red=sum(x['color']=='red' for x in e['rows']); purple=sum(x['color']=='purple' for x in e['rows'])
              reserves.append({'start':e['start'],'end':e['rows'][-1]['month'],'red':red,'purple':purple,'extra':red*25+purple*200,'months':len(e['rows'])})
            worst=max(reserves,key=lambda x:x['extra']) if reserves else None
            return eps,sig,{'adv_pct':(final/eq-1)*100,'max_reserve':worst['extra'] if worst else 0,'worst_episode':worst,'signals':len(sig)}
          def fwd_stats(rows,sig,months):
            pos={r['month']:i for i,r in enumerate(rows)}; rets=[]
            for s in sig:
              i=pos[s['month']]
              if i+months < len(rows): rets.append(rows[i+months]['price']/rows[i]['price']-1)
            if not rets: return None
            return {'n':len(rets),'hit_pct':100*sum(x>0 for x in rets)/len(rets),'median_pct':100*statistics.median(rets),'mean_pct':100*statistics.mean(rets),'worst_pct':100*min(rets)}
          def rolling(rows,months):
            vals=[]
            if len(rows)<months: return None
            for i in range(0,len(rows)-months+1):
              sub=rows[i:i+months]
              _,_,d=dca_result(sub); vals.append(d['adv_pct'])
            return {'windows':len(vals),'win_pct':100*sum(x>0 for x in vals)/len(vals),'median_adv_pct':statistics.median(vals),'worst_adv_pct':min(vals),'best_adv_pct':max(vals)}
          def analyze(rows):
            eps,sig,dca=dca_result(rows)
            starts=[e['rows'][0] for e in eps if e['rows']]
            return {'months':len(rows),'start':rows[0]['month'],'end':rows[-1]['month'],'episodes':len(eps),'red':sum(x['color']=='red' for x in sig),'purple':sum(x['color']=='purple' for x in sig),'dca':dca,'signals_all':{'fwd6':fwd_stats(rows,sig,6),'fwd12':fwd_stats(rows,sig,12)},'episode_starts':{'n':len(starts),'fwd6':fwd_stats(rows,starts,6),'fwd12':fwd_stats(rows,starts,12)},'rolling5y':rolling(rows,60),'rolling10y':rolling(rows,120)}
          raw_eq={k:yahoo_monthly(v) for k,v in EQUITY.items()}; cls_eq={k:classify(v) for k,v in raw_eq.items()}
          common=sorted(set.intersection(*[set(r['month'] for r in v) for v in cls_eq.values()]))
          commonset=set(common); eq={k:[r for r in v if r['month'] in commonset] for k,v in cls_eq.items()}
          checks={'same_count':len(set(len(v) for v in eq.values()))==1,'same_start':len(set(v[0]['month'] for v in eq.values()))==1,'same_end':len(set(v[-1]['month'] for v in eq.values()))==1,'common_months':len(common),'start':common[0],'end':common[-1]}
          if not all(checks[k] for k in ('same_count','same_start','same_end')): raise RuntimeError(str(checks))
          alt={k:analyze(classify(yahoo_monthly(v))) for k,v in ALT.items()}
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rule':'MA10 mensual ±5%; filtro 12m previo positivo; DCA 100/125/300; sin optimización','equity_contract':'Yahoo adjusted close mensual; ETF indexados USD; misma ventana exacta','equity_symbols':EQUITY,'equity_checks':checks,'equity':{k:analyze(v) for k,v in eq.items()},'alternatives_contract':'Misma regla pero pruebas independientes; no comparar métricas cruzadas con índices por distinta naturaleza del activo','alternative_symbols':ALT,'alternatives':alt}
          os.makedirs('backtests',exist_ok=True)
          with open('backtests/validacion_cantasenales.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/validacion_cantasenales.json
          git diff --cached --quiet || git commit -m 'Resultados validación cantaseñales'
          git push
