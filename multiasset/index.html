<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202328"><title>Semáforo Multi-Activo</title><style>:root{--bg:#202328;--panel:#2b2f34;--line:#444a52;--text:#f5f7fa;--muted:#abb4bf;--green:#19b75b;--yellow:#e2b400;--red:#e53935;--purple:#7e22ce;--important:#ffe66a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{padding:14px 12px 92px}.app{max-width:680px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top h1{font-size:22px;margin:0}.sub,.status,.hint{font-size:11px;color:var(--muted)}.status{text-align:right}.macro{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.macro-title{font-size:12px;font-weight:850;margin-bottom:9px}.macro-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.macro-chip{background:#22262b;border-radius:10px;padding:9px;text-align:center}.dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:5px}.green{background:var(--green)}.yellow{background:var(--yellow)}.red{background:var(--red)}.purple{background:var(--purple)}.assets{display:grid;gap:10px}.asset{border-radius:17px;padding:15px;border:1px solid rgba(255,255,255,.13);box-shadow:0 7px 22px rgba(0,0,0,.18)}.asset.greenCard{background:linear-gradient(155deg,#155b36,#234734)}.asset.yellowCard{background:linear-gradient(155deg,#6e5d0d,#494119)}.asset.redCard{background:linear-gradient(155deg,#792020,#4f2020)}.asset.purpleCard{background:linear-gradient(155deg,#521983,#38204b)}.asset-head{display:flex;justify-content:space-between;gap:8px}.name{font-size:16px;font-weight:900}.state{font-size:12px;font-weight:900}.action{font-size:21px;font-weight:900;margin:9px 0 4px}.metrics{font-size:12px;line-height:1.45}.context{font-size:11px;color:#d6dce2;margin-top:7px;line-height:1.45}.important{color:var(--important);font-size:11px;font-weight:850;margin-top:7px;line-height:1.4}.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(32,35,40,0),#202328 24%,#202328)}button{display:block;width:min(656px,calc(100vw - 24px));margin:auto;border:0;border-radius:14px;padding:15px;background:#f6f7f9;color:#15171a;font-size:15px;font-weight:900}.hint{text-align:center;margin-top:6px}.error{color:#ff9d9d}.loading{padding:26px 10px;text-align:center;color:var(--muted)}</style></head><body><div class="app"><div class="top"><div><h1>Semáforo Multi-Activo</h1><div class="sub">Dónde aparece zona de acumulación</div></div><div id="status" class="status">Cargando…</div></div><section class="macro"><div class="macro-title">CONTEXTO MACRO COMÚN</div><div id="macro" class="macro-row"><div class="loading" style="grid-column:1/4">Esperando datos…</div></div></section><div id="assets" class="assets"><div class="loading">Calculando maestros de cada activo…</div></div></div></div><div class="foot"><button id="btn">ACTUALIZAR</button><div class="hint">DCA normal siempre · rojo/morado despliegan reserva adicional</div></div><script>const names={ACWI:'Renta variable global',TLT:'Bonos largos',GLD:'Oro',BTC:'Bitcoin'};const order=['ACWI','TLT','GLD','BTC'];const card=c=>c+'Card';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(p){if(!p||p.status!=='OK')throw Error('Datos aún no generados');document.getElementById('macro').innerHTML=['B1','B2','B5'].map(k=>{const b=p.macro[k];return `<div class="macro-chip"><div><span class="dot ${b.color}"></span><b>${k}</b></div><div class="hint">${esc(b.state)}</div></div>`}).join('');document.getElementById('assets').innerHTML=order.map(k=>{const a=p.assets[k];return `<section class="asset ${card(a.color)}"><div class="asset-head"><div class="name">${esc(names[k])}</div><div class="state">${esc(a.state)}</div></div><div class="action">${esc(a.action)}</div><div class="metrics">${esc(a.metrics)}</div><div class="context">${esc(a.context)}</div>${a.important?`<div class="important">${esc(a.important)}</div>`:''}</section>`}).join('');const d=new Date(p.generated_at);document.getElementById('status').textContent='Datos: '+d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}async function load(){const b=document.getElementById('btn'),s=document.getElementById('status');b.disabled=true;s.textContent='Actualizando…';try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);render(await r.json())}catch(e){s.innerHTML='<span class="error">Pendiente de datos. Reintenta.</span>'}finally{b.disabled=false}}document.getElementById('btn').onclick=load;load();</script></body></html>
